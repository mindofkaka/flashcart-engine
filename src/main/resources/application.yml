spring:
  application:
    name: flashcart-engine

  datasource:
    url: jdbc:postgresql://localhost:5433/flashcart_db
    username: postgres
    password: 123
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: localhost
      port: 6379

server:
  port: 8080
  forward-headers-strategy: native
  tomcat:
    remoteip:
      remote-ip-header: X-Forwarded-For

flashcart:
  rate-limit:
    enabled: true
    fail-open: true          # if Redis is down: true = allow, false = reject
    ip:
      capacity: 10           # burst size
      refill-per-second: 10  # sustained rate: 10 req/s
    user:
      capacity: 1
      refill-per-second: 0.5 # 1 purchase every 2 seconds
  idempotency:
    enabled: true
    processing-ttl: 10m    # lock lifetime if the app crashes mid-request
    completed-ttl: 24h     # how long a finished response can be replayed

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always      # now shows Postgres and Redis status
  metrics:
    tags:
      application: flashcart-engine
    distribution:
      percentiles-histogram:
        "[http.server.requests]": true   # required for histogram_quantile (p99)