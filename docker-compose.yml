services:
  postgres:
    image: postgres:16-alpine
    container_name: flashcart_postgres
    environment:
      POSTGRES_DB: flashcart_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: flashcart_redis
    ports:
      - "6379:6379"

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: flashcart_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"   # needed on Linux, harmless on Docker Desktop
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.1.0
    container_name: flashcart_grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: 123
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  postgres_data:
  prometheus_data:
  grafana_data: